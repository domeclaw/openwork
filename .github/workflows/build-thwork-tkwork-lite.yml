name: Build THWork Desktop (tkwork-lite)

on:
  workflow_dispatch:
  create:
    tags:
      - '*'

jobs:
  build-thwork:
    name: Build THWork ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact-name: thwork-macos-arm64
          - os: windows-latest
            platform: windows
            arch: x64
            artifact-name: thwork-windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron desktop
        run: pnpm --filter @openwork/desktop run build:electron

      - name: Package DMG/Installer (ad-hoc signed)
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            # Build unsigned first
            pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dir --publish never
            
            # Find the .app bundle
            APP_PATH=$(find apps/desktop/dist-electron/mac* -name "*.app" -type d | head -1)
            
            if [ -n "$APP_PATH" ]; then
              # Apply ad-hoc signature to the app bundle
              codesign --force --deep --sign - "$APP_PATH"
              echo "✓ Ad-hoc signed: $APP_PATH"
              
              # Repackage to DMG and ZIP
              pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --mac dmg zip --publish never
            else
              echo "❌ No .app bundle found"
              exit 1
            fi
          else
            pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis --publish never
          fi
        shell: bash

      - name: Upload DMG artifact (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-dmg
          path: apps/desktop/dist-electron/*.dmg
          retention-days: 30

      - name: Upload ZIP artifact (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-zip
          path: apps/desktop/dist-electron/*.zip
          retention-days: 30

      - name: Upload NSIS Installer (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-installer
          path: apps/desktop/dist-electron/*.exe
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-thwork
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: THWork ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
